name: Replacement foundation
on:
  push:
    paths: ['backend-next/**', 'scripts/next-db.py', 'scripts/checks/**', 'docs/api/next-v2.yaml', '.github/workflows/backend-next.yml']
  pull_request:
    paths: ['backend-next/**', 'scripts/next-db.py', 'scripts/checks/**', 'docs/api/next-v2.yaml', '.github/workflows/backend-next.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install local PostgreSQL tools
        run: sudo apt-get update && sudo apt-get install -y postgresql postgresql-contrib
      - name: Start isolated development and test cluster
        run: python3 scripts/next-db.py start
      - name: Build and test replacement
        working-directory: backend-next
        run: ./mvnw --batch-mode clean verify
      - name: Check implemented API contract
        run: python3 scripts/checks/next-contract.py
      - name: Stop private cluster
        if: always()
        run: python3 scripts/next-db.py stop
