name: Build and verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven, cache-dependency-path: backend/pom.xml}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: sudo apt-get update && sudo apt-get install -y postgresql postgresql-contrib
      - run: python3 scripts/local-db.py start
      - run: createdb -h 127.0.0.1 -p 55432 -U wayline wayline_test
        env: {PGPASSWORD: 'WaylineDb123!'}
      - run: ./mvnw -B verify
        working-directory: backend
        env:
          TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:55432/wayline_test
          TEST_DATABASE_USER: wayline
          TEST_DATABASE_PASSWORD: 'WaylineDb123!'
      - run: npm ci && npm test && npm run build && npm run format:check
        working-directory: frontend
      - run: python3 scripts/openapi.py --check
      - run: python3 scripts/permissions.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: wayline-build
          path: |
            backend/target/transport-backend-2.0.0.jar
            frontend/dist
            backend/target/surefire-reports
            docs/openapi.json
