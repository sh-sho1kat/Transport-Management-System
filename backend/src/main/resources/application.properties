spring.application.name=wayline
spring.profiles.default=local
server.port=${PORT:8000}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/wayline}
spring.datasource.username=${DATABASE_USER:wayline}
spring.datasource.password=${DATABASE_PASSWORD:wayline}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=30m
server.error.include-message=never
spring.servlet.multipart.enabled=false
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}
app.timezone=${OPERATOR_TIMEZONE:Asia/Dhaka}
app.hold-minutes=${HOLD_MINUTES:5}
app.max-seats=${MAX_SEATS:4}
app.cancel-hours=${CANCELLATION_HOURS:2}
app.turnaround-minutes=${TURNAROUND_MINUTES:30}
app.admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
app.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.mail-enabled=${MAIL_ENABLED:false}
app.mail-from=${MAIL_FROM:no-reply@example.test}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_TLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Do not log database error details, which may contain row/contact values.
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF

# Email is optional; do not require SMTP when recovery mail is disabled.
management.health.mail.enabled=${app.mail-enabled}
