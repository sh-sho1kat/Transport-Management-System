{
  "openapi": "3.0.3",
  "info": {
    "title": "Wayline Next \u2014 implemented foundation only",
    "version": "0.1.0",
    "description": "Implemented Increment 0 only. Future business endpoints use /api/v1 on port 8089. No authentication or business endpoint exists yet."
  },
  "servers": [
    {
      "url": "http://localhost:8089"
    }
  ],
  "paths": {
    "/actuator/health": {
      "get": {
        "operationId": "health",
        "responses": {
          "200": {
            "description": "Application and database healthy",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "status"
                  ],
                  "properties": {
                    "status": {
                      "type": "string",
                      "enum": [
                        "UP"
                      ]
                    }
                  }
                }
              }
            }
          },
          "503": {
            "description": "Application dependency unhealthy"
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "ApiErrorResponse": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "timestamp",
          "status",
          "code",
          "message",
          "path",
          "traceId"
        ],
        "properties": {
          "timestamp": {
            "type": "string",
            "format": "date-time"
          },
          "status": {
            "type": "integer"
          },
          "code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "path": {
            "type": "string"
          },
          "traceId": {
            "type": "string",
            "format": "uuid"
          }
        }
      }
    }
  }
}
